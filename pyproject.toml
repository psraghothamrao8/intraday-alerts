[project]
name = "intraday-alerts"
version = "0.3.0"
description = "Intraday alert bot for Indian cash stocks"
readme = "spec/README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "curl_cffi>=0.15.0",
    "pypdf>=6.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pywebpush>=2.5.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that require internet / exchange access",
    "live_llm: tests that call Claude API",
]
